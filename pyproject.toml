[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spencer-agent"
version = "0.1.0"
description = "A safe, terminal-first coding agent for local repositories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Spencer contributors" }]
dependencies = ["openai>=1.50.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spencer = "spencer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
