name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Smoke test CLI
        run: python -m spencer.cli --version

  npm:
    name: npm on ${{ matrix.os }} with Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install npm package
        run: npm ci
      - name: Test npm wrapper
        run: npm test
      - name: Check npm package
        run: npm run check
      - name: Smoke test npm command
        run: node bin/spencer.js --version

  quality:
    name: Static quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install quality dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Compile package
        run: python -m compileall -q src

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, npm, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build Python wheel and sdist
        run: python -m build
      - name: Check Python artifacts
        run: python -m twine check dist/*
      - name: Install Python wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --no-deps dist/*.whl
          .ci-venv/bin/spencer --version
          .ci-venv/bin/spencer --help
      - name: Pack npm tarball
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: spencer-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
