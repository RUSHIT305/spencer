name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install npm package
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Validate Node source and package manifest
        run: npm run check
      - name: Smoke test CLI
        run: node bin/spencer.js --version

  package:
    name: Clean npm package installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install and test source package
        run: npm ci && npm test
      - name: Create npm tarball
        shell: bash
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install tarball in a clean consumer project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spencer-consumer"
          cd "$RUNNER_TEMP/spencer-consumer"
          npm init -y
          npm install "$RUNNER_TEMP"/spencer-agent-*.tgz
          ./node_modules/.bin/spencer --version
      - uses: actions/upload-artifact@v4
        with:
          name: spencer-npm-package
          path: ${{ runner.temp }}/spencer-agent-*.tgz
          if-no-files-found: error
          retention-days: 14
