name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Validate source and installer scripts
        run: npm run check
      - name: Smoke test source CLI
        run: node bin/spencer.js --version
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null
          Write-Host 'PowerShell installer parsed successfully.'

  standalone:
    name: Linux standalone executable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Build standalone executable
        run: npm run build:binary -- --output "$RUNNER_TEMP/spencer-linux-x64"
      - name: Smoke test standalone executable
        run: "$RUNNER_TEMP/spencer-linux-x64 --version"
      - name: Upload standalone smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: spencer-linux-x64-ci
          path: ${{ runner.temp }}/spencer-linux-x64
          if-no-files-found: error
          retention-days: 7
