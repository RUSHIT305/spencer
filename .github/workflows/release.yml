name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish npm release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Verify version matches tag
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      - name: Install and test npm package
        run: npm ci && npm test && npm run check
      - name: Create npm tarball
        run: npm pack
      - name: Attest npm build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.tgz'
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes --title "$GITHUB_REF_NAME"
